name: Build APK
on: [push, workflow_dispatch]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install --legacy-peer-deps
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --console=plain > ../build.log 2>&1 || { echo "::error title=Build failed::$(grep -nE 'FAILURE|What went wrong|error:|^e: |Execution failed|Could not' ../build.log | head -40 | sed ':a;N;$!ba;s/\n/%0A/g')"; exit 1; }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log
      - uses: actions/upload-artifact@v4
        with:
          name: LocalConnect-apk
          path: android/app/build/outputs/apk/release/app-release.apk